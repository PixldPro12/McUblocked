<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Version</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .box { background: #222; padding: 20px; border-radius: 10px; width: 100%; max-width: 360px; }
    input, select, button, .dl-btn { width: 100%; box-sizing: border-box; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 6px; border: none; display: block; text-align: center; text-decoration: none; }
    input, select { background: #333; color: #fff; text-align: left; }
    button { background: #2ea043; color: #fff; font-weight: bold; }
    .dl-btn { background: #1f6feb; color: #fff; font-weight: bold; }
    .toggle { background: none; color: #888; font-size: 13px; text-decoration: underline; margin-top: 15px; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #ccc; }
  </style>
</head>
<body>

  <!-- UNLOCK SCREEN -->
  <div class="box" id="unlockView">
    <h3 style="margin-top:0">Enter Password</h3>
    <input type="password" id="unlockPwd" placeholder="Enter password..." onkeydown="if(event.key==='Enter') runApp()">
    <button onclick="runApp()">Decrypt & Run</button>
    <p id="status" style="color:#ff6b6b; font-size:14px;"></p>
    <button class="toggle" onclick="switchMode(true)">Encrypt 1 File at a Time</button>
  </div>

  <!-- SINGLE-FILE ENCRYPT SCREEN -->
  <div class="box" id="encryptView" style="display:none;">
    <h3 style="margin-top:0">Encrypt One File</h3>
    
    <label>1. Which file are you encrypting?
      <select id="targetName">
        <option value="index.html">index.html</option>
        <option value="classes.js">classes.js</option>
        <option value="assets.epk">assets.epk</option>
      </select>
    </label>

    <label>2. Pick the file from your phone:
      <input type="file" id="singleFile">
    </label>

    <label>3. Password:
      <input type="password" id="encPwd" placeholder="Enter password...">
    </label>

    <button id="encBtn" onclick="encryptOne()">Encrypt File</button>
    <div id="dlArea" style="margin-top:10px;"></div>
    <p id="encStatus" style="color:#4ade80; font-size:14px;"></p>

    <button class="toggle" onclick="switchMode(false)">Back to Unlock Screen</button>
  </div>

  <script>
    const HTML_NAME = "index.html";
    const JS_NAME   = "classes.js";
    const EPK_NAME  = "assets.epk";
    // Split output into 18MB chunks so every file stays safely under GitHub's 25MB limit
    const MAX_CHUNK_SIZE = 18 * 1024 * 1024;

    function switchMode(isEncrypt) {
      document.getElementById("unlockView").style.display = isEncrypt ? "none" : "block";
      document.getElementById("encryptView").style.display = isEncrypt ? "block" : "none";
    }

    const toB64 = buf => {
      const bytes = new Uint8Array(buf);
      let bin = "";
      for (let i = 0; i < bytes.byteLength; i += 8192) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      }
      return btoa(bin);
    };

    const fromB64 = s => {
      const bin = atob(s.trim());
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    };

    async function getKey(password, usage) {
      const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
      return await crypto.subtle.importKey("raw", hash, { name: "AES-GCM" }, false, [usage]);
    }

    // --- ENCRYPT & AUTO-SPLIT IF > 18MB ---
    async function encryptOne() {
      const file = document.getElementById("singleFile").files;
      const target = document.getElementById("targetName").value;
      const pwd = document.getElementById("encPwd").value;
      const status = document.getElementById("encStatus");
      const dlArea = document.getElementById("dlArea");

      if (!file) return alert("Pick a file first!");
      if (!pwd) return alert("Enter a password!");

      status.textContent = "Encrypting " + target + "...";
      dlArea.innerHTML = "";

      try {
        const key = await getKey(pwd, "encrypt");
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const buf = await file.arrayBuffer();
        const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, buf);

        const fullPayload = JSON.stringify({ iv: toB64(iv), data: toB64(encrypted) });

        if (fullPayload.length <= MAX_CHUNK_SIZE) {
          // Small enough for 1 single .enc file
          createDownloadBtn(dlArea, fullPayload, target + ".enc");
          status.textContent = "Ready! Tap the blue button to save.";
        } else {
          // Split into .enc.1, .enc.2, etc. (all under 18MB)
          const totalParts = Math.ceil(fullPayload.length / MAX_CHUNK_SIZE);
          for (let i = 0; i < totalParts; i++) {
            const slice = fullPayload.slice(i * MAX_CHUNK_SIZE, (i + 1) * MAX_CHUNK_SIZE);
            createDownloadBtn(dlArea, slice, `${target}.enc.${i + 1}`);
          }
          status.textContent = `Split into ${totalParts} parts (under 25MB each). Download and upload all parts!`;
        }
      } catch (e) {
        status.textContent = "Error: " + e.message;
      }
    }

    function createDownloadBtn(container, textData, filename) {
      const blob = new Blob([textData], { type: "application/octet-stream" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.className = "dl-btn";
      a.textContent = "Download " + filename;
      container.appendChild(a);
    }

    // --- FETCH SINGLE OR SPLIT .ENC FILES & DECRYPT ---
    async function fetchJoinedText(name) {
      // Try single .enc file first
      const singleRes = await fetch(name + ".enc");
      if (singleRes.ok) return await singleRes.text();

      // Otherwise fetch .enc.1, .enc.2, ... until 404
      let joined = "";
      let part = 1;
      while (true) {
        const partRes = await fetch(`${name}.enc.${part}`);
        if (!partRes.ok) break;
        joined += await partRes.text();
        part++;
      }
      if (!joined) throw new Error("Missing " + name);
      return joined;
    }

    async function fetchDecrypt(name, key) {
      const rawText = await fetchJoinedText(name);
      const json = JSON.parse(rawText);
      return await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(json.iv) }, key, fromB64(json.data));
    }

    async function runApp() {
      const status = document.getElementById("status");
      const pwd = document.getElementById("unlockPwd").value;
      if (!pwd) return (status.textContent = "Please enter your password.");

      status.textContent = "Decrypting...";
      try {
        const key = await getKey(pwd, "decrypt");

        const [htmlBuf, jsBuf, epkBuf] = await Promise.all([
          fetchDecrypt(HTML_NAME, key),
          fetchDecrypt(JS_NAME, key),
          fetchDecrypt(EPK_NAME, key)
        ]);

        const jsUrl  = URL.createObjectURL(new Blob([jsBuf],  { type: "application/javascript" }));
        const epkUrl = URL.createObjectURL(new Blob([epkBuf], { type: "application/octet-stream" }));

        let html = new TextDecoder().decode(htmlBuf);
        html = html.split(JS_NAME).join(jsUrl).split(EPK_NAME).join(epkUrl);

        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        status.textContent = "Wrong password or missing .enc files.";
      }
    }
  </script>
</body>
</html>
