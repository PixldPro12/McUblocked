<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dekryptor-v0.4</title>
  <style>
    * { box-sizing: border-box; font-family: Consolas, monospace; }
    body { background: #1b1d1a; color: #d8ded3; margin: 0; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 95vh; }
    .win { width: 100%; max-width: 460px; background: #2f342d; border: 2px solid; border-color: #596055 #151714 #151714 #596055; padding: 8px; }
    .log { background: #181a17; border: 2px solid; border-color: #10120f #4c5249 #4c5249 #10120f; height: 290px; overflow-y: auto; padding: 8px; font-size: 12px; line-height: 1.4; white-space: pre-wrap; }
    .row { display: flex; gap: 6px; margin-top: 6px; }
    input, select { flex: 1; background: #181a17; color: #e6ece0; border: 2px solid; border-color: #10120f #4c5249 #4c5249 #10120f; padding: 8px; font-size: 14px; }
    button, .dl { background: #3d433a; color: #e6ece0; border: 2px solid; border-color: #596055 #151714 #151714 #596055; padding: 8px 12px; font-weight: bold; text-align: center; text-decoration: none; display: block; }
    .dl { color: #d9822b; margin-top: 5px; }
    .b { color: #d9822b; font-weight: bold; } .ok { color: #90c95b; } .w { color: #e5b54f; } .err { color: #ff5555; font-weight: bold; }
  </style>
</head>
<body>
<div class="win">
  <div style="font-size:13px;font-weight:bold;padding-bottom:6px;">] Console — Dekryptor-v0.4 <span style="float:right;color:#90c95b;">READY</span></div>
  <div class="log" id="out"></div>

  <div id="uBar" class="row">
    <input type="password" id="uPwd" placeholder="Enter password..." onkeydown="if(event.key==='Enter')run()">
    <button onclick="run()">Submit</button>
  </div>

  <div id="eBar" style="display:none;margin-top:6px;">
    <select id="tName" style="width:100%"><option>index.html</option><option>classes.js</option><option>assets.epk</option></select>
    <input type="file" id="fIn" style="width:100%;margin-top:6px;">
    <div class="row"><input type="password" id="ePwd" placeholder="Create password..."><button onclick="encOne()">Encrypt</button></div>
    <div id="dl"></div>
  </div>

  <div class="row" style="justify-content:space-between;">
    <button onclick="init()" style="font-size:11px;padding:4px 8px;">Clear</button>
    <button id="mBtn" onclick="flip()" style="font-size:11px;padding:4px 8px;">Mode: Encrypt</button>
  </div>
</div>

<script>
const FILES = ["index.html", "assets.epk", "classes.js"], CHUNK = 18 * 1024 * 1024, out = document.getElementById("out");
let encMode = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const log = (t, c = "") => { out.innerHTML += `<div class="${c}">${t}</div>`; out.scrollTop = out.scrollHeight; };

function init() {
  out.innerHTML = "";
  log("/###############/\n/ Dekryptor-v0.4 /\n/###############/", "b");
  log("Awaiting password input...", "w");
}

function flip() {
  encMode = !encMode;
  uBar.style.display = encMode ? "none" : "flex";
  eBar.style.display = encMode ? "block" : "none";
  mBtn.textContent = encMode ? "Mode: Unlock" : "Mode: Encrypt";
}

const toB64 = b => { let u = new Uint8Array(b), s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0));
const getKey = async (p, u) => crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", new TextEncoder().encode(p)), "AES-GCM", false, [u]);

async function blocks(label) {
  log(`Decryption of ${label}`, "w");
  for (let i = 1; i <= 10; i++) { log(`Block ${i}/10 complete`); await sleep(25); }
}

async function fetchPkg(name) {
  let r = await fetch(name + ".enc");
  if (r.ok) { log(`  ${name}.enc [OK]`, "ok"); return { txt: await r.text(), sliced: false }; }
  let txt = "", p = 1;
  while ((r = await fetch(`${name}.enc.${p}`)).ok) { log(`  ${name}.enc.${p} [OK]`, "ok"); txt += await r.text(); p++; }
  if (!txt) throw new Error(`Missing ${name}.enc`);
  return { txt, sliced: true };
}

async function run() {
  const pwd = uPwd.value;
  if (!pwd) return log("ERROR: No password entered.", "err");
  log("Password given!\nPreparing for decryption...\nChecking Required Files for decrypt:", "w");

  try {
    const key = await getKey(pwd, "decrypt"), bufs = {};
    for (const f of FILES) {
      const pkg = await fetchPkg(f);
      if (pkg.sliced) { log(`PREPARE to stitch files (${f}.enc.*)...`, "w"); await blocks(`${f} (stitched)`); log("Decryption Of Sliced Files Complete", "ok"); }
      else await blocks(f + ".enc");
      const j = JSON.parse(pkg.txt);
      bufs[f] = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(j.iv) }, key, fromB64(j.data));
    }
    const jsUrl = URL.createObjectURL(new Blob([bufs["classes.js"]], { type: "application/javascript" }));
    const epkUrl = URL.createObjectURL(new Blob([bufs["assets.epk"]], { type: "application/octet-stream" }));
    let html = new TextDecoder().decode(bufs["index.html"]).split("classes.js").join(jsUrl).split("assets.epk").join(epkUrl);
    log("Executing game...", "ok"); await sleep(200);
    document.open(); document.write(html); document.close();
  } catch (e) { log(`FATAL ERROR: ${e.message || e.name}`, "err"); }
}

async function encOne() {
  const file = fIn.files, name = tName.value, pwd = ePwd.value;
  if (!file || !pwd) return log("ERROR: Pick a file and enter a password.", "err");
  log(`Password given!\nPreparing for encryption of ${name}...`, "w"); dl.innerHTML = "";
  try {
    const key = await getKey(pwd, "encrypt"), iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, await file.arrayBuffer());
    const payload = JSON.stringify({ iv: toB64(iv), data: toB64(enc) });
    const parts = Math.ceil(payload.length / CHUNK);
    for (let i = 0; i < parts; i++) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([payload.slice(i * CHUNK, (i + 1) * CHUNK)]));
      a.download = parts === 1 ? `${name}.enc` : `${name}.enc.${i + 1}`;
      a.className = "dl"; a.textContent = `Download ${a.download}`; dl.appendChild(a);
    }
    log(`Encryption complete (${parts} file${parts > 1 ? "s" : ""}).`, "ok");
  } catch (e) { log(`ERROR: ${e.message}`, "err"); }
}
init();
</script>
</body>
</html>
