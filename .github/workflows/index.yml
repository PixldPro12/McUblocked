name: Generate Apache Index
on:
  push:
    branches: [ main ]
permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Index of HTML files
        run: |
          find . -maxdepth 4 -not -path '*/.*' -type d | while read -r dir; do
            if [ "$dir" != "." ] && [ -f "$dir/index.html" ]; then
              continue
            fi
            clean="${dir#./}"
            [ "$dir" = "." ] && title="Index of /McUblocked" || title="Index of /McUblocked/$clean"
            {
              echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>$title</title></head><body>"
              echo "<h1>$title</h1><hr><pre>"
              echo "<a href='../'>../</a>"
              for item in "$dir"/*; do
                [ -e "$item" ] || continue
                name=$(basename "$item")
                [ "$name" = "index.html" ] && continue
                date=$(date -r "$item" "+%d-%b-%Y %H:%M")
                if [ -d "$item" ]; then
                  printf "<a href='%s/'>%-50s</a> %s                   -\n" "$name" "$name/" "$date"
                else
                  size=$(stat -c%s "$item")
                  printf "<a href='%s'>%-50s</a> %s %19s\n" "$name" "$name" "$date" "$size"
                fi
              done
              echo "</pre><hr><address>Apache/2.4.58 (Unix) Server at pixldpro12.github.io Port 80</address></body></html>"
            } > "$dir/index.html"
          done
      - name: Commit generated indexes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-update directory index"
          git push
          
